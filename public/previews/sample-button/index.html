<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample button preview</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f4f6f8}
button{font:inherit;padding:.8rem 1.6rem;border:0;border-radius:999px;background:#0088cc;color:#fff;cursor:pointer;transition:transform .15s}
button:hover{transform:translateY(-2px)}button:focus-visible{outline:3px solid #ffb400;outline-offset:3px}</style></head>
<body><button type="button" id="b">Clicked 0 times</button>
<script>var n=0,b=document.getElementById('b');b.onclick=function(){n++;b.textContent='Clicked '+n+' time'+(n===1?'':'s')}</script></body></html>
