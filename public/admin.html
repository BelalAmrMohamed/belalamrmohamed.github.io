<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belal Admin</title>
  <style>
    :root {
      --bg: #08131f;
      --panel: #111d2c;
      --panel-alt: #16293a;
      --surface: #1f3550;
      --surface-strong: #2a4a6e;
      --text: #eaf2ff;
      --muted: #99acc9;
      --primary: #5ab2ff;
      --primary-strong: #2a8cff;
      --success: #4ade80;
      --danger: #f87171;
      --warning: #fbbf24;
      --border: rgba(154, 179, 214, 0.2);
      --shadow: 0 24px 60px rgba(2, 6, 23, 0.5);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(90,178,255,0.12), transparent 30%), var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .admin-shell {
      width: min(1100px, 100%);
      background: rgba(10, 18, 30, 0.86);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .auth-card,
    .dashboard {
      padding: 32px;
    }

    .auth-card {
      max-width: 500px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .eyebrow {
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.72rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(19, 31, 46, 0.9);
      color: var(--text);
      padding: 12px 14px;
      width: 100%;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: 2px solid rgba(90, 178, 255, 0.45);
      border-color: rgba(90, 178, 255, 0.65);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease, background 0.16s ease;
      font-weight: 700;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.98;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      border: none;
    }

    .secondary-btn {
      background: rgba(90, 178, 255, 0.08);
    }

    .danger-btn {
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.25);
    }

    .status {
      min-height: 24px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .status.error { color: #fecaca; }
    .status.success { color: #bbf7d0; }
    .status.info { color: #dbeafe; }

    .hidden { display: none !important; }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .dashboard-header h2 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw, 2.3rem);
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(90, 178, 255, 0.08);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(17, 29, 44, 0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
    }

    .stat-card span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: clamp(1.6rem, 2vw, 2.3rem);
      letter-spacing: -0.04em;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      gap: 20px;
    }

    .panel {
      background: rgba(17, 29, 44, 0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    .panel h3 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.1rem;
    }

    .project-list {
      display: grid;
      gap: 12px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .project-item {
      border: 1px solid var(--border);
      background: rgba(33, 52, 74, 0.8);
      border-radius: 14px;
      padding: 14px 16px;
      display: grid;
      gap: 8px;
    }

    .project-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .project-item strong {
      font-size: 1rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(90, 178, 255, 0.12);
      color: #dbeafe;
      border: 1px solid rgba(90, 178, 255, 0.24);
    }

    .project-item p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .project-item-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .mini-btn {
      padding: 8px 10px;
      font-size: 0.8rem;
      border-radius: 10px;
    }

    .empty-state {
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      .stats-grid,
      .content-grid,
      .button-row {
        grid-template-columns: 1fr;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div id="authView" class="auth-card">
      <div class="eyebrow">Portfolio Admin</div>
      <div>
        <h1>Access the dashboard</h1>
      </div>
      <p class="subtitle">Sign in to manage your projects, portfolio highlights, and site content.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="admin@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required />
        </div>

        <div class="button-row">
          <button class="primary-btn" type="submit">Sign in</button>
          <button id="demoModeBtn" class="secondary-btn" type="button">Use demo mode</button>
        </div>
      </form>

      <div class="button-row">
        <button id="googleLoginBtn" class="secondary-btn" type="button">Continue with Google</button>
        <button id="githubLoginBtn" class="secondary-btn" type="button">Continue with GitHub</button>
      </div>

      <div id="authStatus" class="status info" aria-live="polite"></div>
    </div>

    <div id="dashboardView" class="dashboard hidden">
      <div class="dashboard-header">
        <div>
          <div class="eyebrow">Admin dashboard</div>
          <h2>Portfolio control center</h2>
        </div>
        <div class="meta-badge">Logged in as <strong id="userEmail">admin</strong></div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span>Total projects</span>
          <strong id="totalProjects">0</strong>
        </div>
        <div class="stat-card">
          <span>Featured</span>
          <strong id="featuredProjects">0</strong>
        </div>
        <div class="stat-card">
          <span>Storage</span>
          <strong>Supabase</strong>
        </div>
      </div>

      <div class="content-grid">
        <aside class="panel">
          <h3 id="formTitle">Add project</h3>
          <form id="projectForm">
            <input id="projectId" type="hidden" />

            <div class="field">
              <label for="projectTitle">Project title</label>
              <input id="projectTitle" type="text" required />
            </div>

            <div class="field">
              <label for="projectCategory">Category</label>
              <input id="projectCategory" type="text" value="Web Development" required />
            </div>

            <div class="field">
              <label for="projectUrl">Project URL</label>
              <input id="projectUrl" type="url" placeholder="https://example.com" />
            </div>

            <div class="field">
              <label for="projectGithub">GitHub URL</label>
              <input id="projectGithub" type="url" placeholder="https://github.com/owner/repo" />
            </div>

            <div class="field">
              <label for="projectImage">Image URL</label>
              <input id="projectImage" type="url" placeholder="https://images.example.com/project.jpg" />
            </div>

            <div class="field">
              <label for="projectStatus">Status</label>
              <select id="projectStatus">
                <option value="featured">Featured</option>
                <option value="active">Active</option>
                <option value="archived">Archived</option>
              </select>
            </div>

            <div class="field">
              <label for="projectSummary">Summary</label>
              <textarea id="projectSummary" placeholder="What this project does and why it matters..."></textarea>
            </div>

            <div class="button-row">
              <button class="primary-btn" type="submit">Save project</button>
              <button id="resetProjectForm" class="secondary-btn" type="button">Reset</button>
            </div>
          </form>
        </aside>

        <section class="panel">
          <h3>Projects</h3>
          <ul id="projectList" class="project-list"></ul>
        </section>
      </div>

      <div class="button-row" style="margin-top: 18px; max-width: 180px;">
        <button id="signOutBtn" class="danger-btn" type="button">Sign out</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.53.0/dist/umd/supabase.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
